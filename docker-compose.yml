version: '3.8'

services:
  # 🐘 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: campusmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-campusmart_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-campusmart_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - campusmart_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-campusmart_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ⚡ 2. Soketi Realtime WebSocket Service (Pusher Replacement)
  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: campusmart-soketi
    restart: unless-stopped
    ports:
      - "6001:6001"
    environment:
      SOKETI_DEBUG: "1"
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-campusmart-app}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-campusmart-key}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-campusmart-secret}
    networks:
      - campusmart_net

  # 🚀 3. Backend Express Application Service
  backend:
    build:
      context: ./antasari-mart-backend
      dockerfile: Dockerfile
    container_name: campusmart-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-campusmart_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-campusmart_password}
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASS:-campusmart_password}@postgres:5432/${DB_NAME:-campusmart_db}
      SOKETI_HOST: soketi
      SOKETI_PORT: 6001
      PUSHER_HOST: soketi
      PUSHER_PORT: 6001
      PUSHER_APP_ID: ${PUSHER_APP_ID:-campusmart-app}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY:-campusmart-key}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET:-campusmart-secret}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-SB-Mid-server-YOUR_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-SB-Mid-client-YOUR_CLIENT_KEY}
      EMAIL_SERVICE_USER: ${EMAIL_SERVICE_USER:-mnurmiyaty2@gmail.com}
      EMAIL_SERVICE_PASS: ${EMAIL_SERVICE_PASS:-YOUR_EMAIL_APP_PASS}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-nurmiyaty@gmail.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-123456}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-83df969bc77b40eda859c2cd357be131}
    depends_on:
      postgres:
        condition: service_healthy
      soketi:
        condition: service_started
    networks:
      - campusmart_net

  # 💻 4. Frontend SPA Service (Nginx + Vue/Vite)
  frontend:
    build:
      context: ./antasari-mart-frontend
      dockerfile: Dockerfile
    container_name: campusmart-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - soketi
    networks:
      - campusmart_net

networks:
  campusmart_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
