version: '3.8'

services:
  # 🐘 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: antasari-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-Antasari_Mart}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-123456}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - antasari-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-Antasari_Mart}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ⚡ 2. Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: antasari-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - antasari-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 🍃 3. MongoDB (Chat Storage)
  mongo:
    image: mongo:7.0
    container_name: antasari-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - antasari-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 🚀 4. Backend Node.js / Express
  backend:
    build:
      context: ./antasari-mart-backend
      dockerfile: Dockerfile
    container_name: antasari-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-Antasari_Mart}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://mongo:27017/Antasari_Mart_Chat
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-SB-Mid-server-YOUR_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-SB-Mid-client-YOUR_CLIENT_KEY}
      EMAIL_SERVICE_USER: ${EMAIL_SERVICE_USER:-mnurmiyaty2@gmail.com}
      EMAIL_SERVICE_PASS: ${EMAIL_SERVICE_PASS:-YOUR_EMAIL_APP_PASS}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-nurmiyaty@gmail.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-123456}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-83df969bc77b40eda859c2cd357be131}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - antasari-network

  # 🐘 5. FrankenPHP Worker & Caddy Gateway
  frankenphp:
    build:
      context: ./frankenphp
      dockerfile: Dockerfile
    container_name: antasari-frankenphp
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend:5000
    ports:
      - "8000:8000"
    depends_on:
      - backend
    networks:
      - antasari-network

  # 💻 6. Frontend Production (Nginx + Vite SPA)
  frontend:
    build:
      context: ./antasari-mart-frontend
      dockerfile: Dockerfile
    container_name: antasari-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - frankenphp
    networks:
      - antasari-network

networks:
  antasari-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mongo_data:
    driver: local
